name: Release

# A version tag (v1.2.3) builds unsigned installers for macOS, Windows, and
# Linux and attaches them to a draft GitHub release. A pull request that
# changes this file runs the same builds as a dry run: the installers are kept
# as run artifacts and no release is made.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # No matrix expression here, as in ci.yml: GitHub adds the platform itself.
    name: Installers
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${app_version} in src-tauri/tauri.conf.json"
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS app is built from both architectures.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Without a tag name tauri-action only builds; it makes no release.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Inkwell ${{ github.ref_name }}
          releaseBody: Unsigned builds. On macOS, right-click the app and choose Open the first time. On Windows, choose More info, then Run anyway.
          releaseDraft: true
          prerelease: false
          # A dry run keeps its installers on the workflow run instead.
          uploadWorkflowArtifacts: ${{ github.event_name == 'pull_request' }}
          args: ${{ matrix.args }}
