[package]
name = "inkwell"
version = "0.0.0"
description = "A fast, minimal, local-first desktop word processor with a weekly writing streak."
authors = ["Jared DeCesare"]
license = "MIT"
repository = "https://github.com/smoothjerry/inkwell"
edition = "2021"
publish = false

[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
