[package]
name = "inkwell"
version = "0.0.0"
description = "A fast, minimal, local-first desktop word processor with a weekly writing streak."
authors = ["Jared DeCesare"]
license = "MIT"
repository = "https://github.com/smoothjerry/inkwell"
edition = "2021"
publish = false

[lib]
name = "inkwell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
