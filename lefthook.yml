# Git hooks. Installed by `pnpm install` (the `prepare` script runs `lefthook install`).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
    - name: rustfmt
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

# After a `git pull` that merges changes, rebuild the installed app — but only
# where it was installed with `pnpm install:local`. The build runs in the
# background so the pull is not held up; see the log for its result.
# From a real terminal, lefthook runs the job in a pseudo-terminal and closes
# it as soon as the job's shell exits, which sends a hang-up. `trap '' HUP`
# makes the background build ignore it from the moment it starts; `nohup`
# alone set that up too late and the build was killed before it began.
# A pull from an editor's git panel may not load the shell's config, so the
# usual rustup locations are added to PATH for the build to find `cargo`.
# The pull returns before the build ends, so the job says it has started.
# Once it is installed, a running Inkwell offers Relaunch itself (DESIGN_SPEC
# §7.12); a macOS notification appears only if the build fails.
post-merge:
  jobs:
    - name: reinstall-app
      run: >-
        if [ -d /Applications/Inkwell.app ]; then
        trap '' HUP;
        PATH="$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:$PATH";
        echo "Rebuilding Inkwell in the background. Inkwell will offer Relaunch when it is installed.";
        echo "Log: ~/Library/Logs/inkwell-install.log";
        (pnpm install:local ||
        osascript -e 'display notification "See ~/Library/Logs/inkwell-install.log." with title "Inkwell update failed"')
        > "$HOME/Library/Logs/inkwell-install.log" 2>&1 < /dev/null &
        fi
